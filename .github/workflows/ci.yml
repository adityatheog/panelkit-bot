# Coded by Aditya | GitHub- @adityatheog

# =============================================================================
# PanelKit — continuous integration
#
# Runs without credentials. Every check is static or uses an in-memory database
# and recording doubles, so a fork's pull request gets the same signal as a push
# to main without any secret reaching untrusted code.
# =============================================================================

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_UPDATE_NOTIFIER: 'true'
  NPM_CONFIG_UPDATE_NOTIFIER: 'false'
  CI: 'true'

jobs:
  # ---------------------------------------------------------------------------
  # Syntax, audit and tests
  # ---------------------------------------------------------------------------
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node:
          - '20'    # the minimum package.json supports
          - '22'    # the next LTS line; better-sqlite3 compiles per Node ABI

    steps:
      # v5 rather than v4: v4 targets Node 20, which is deprecated on runners and
      # is now force-run on Node 24 with a warning on every job.
      - name: Check out the repository
        uses: actions/checkout@v5

      # setup-node's `cache: npm` FAILS THE JOB when no lockfile is present, so it
      # cannot be enabled unconditionally. Detecting first means a fresh clone
      # without a lockfile still gets a full run — just without the cache.
      - name: Detect a dependency lockfile
        id: lockfile
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No package-lock.json found. Dependency caching is disabled and builds are not reproducible. Run 'npm install' and commit the lockfile."
          fi

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # An empty string disables caching; 'npm' enables it. Conditional
          # because the cache step is fatal without a lockfile.
          cache: ${{ steps.lockfile.outputs.present == 'true' && 'npm' || '' }}

      - name: Install the build toolchain
        # better-sqlite3 has no prebuilt binary for every Node version, so node-gyp
        # compiles it. Pinned rather than assumed, so a runner image change cannot
        # silently remove g++.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes python3 make g++

      - name: Install dependencies
        run: |
          if [ "${{ steps.lockfile.outputs.present }}" = "true" ]; then
            npm ci
          else
            npm install
          fi

      - name: Check syntax and imports
        # Parses every source file and imports every module, so a renamed export or
        # a broken relative path fails here rather than at startup.
        run: npm run syntax

      - name: Audit the project
        # Structural completeness: expected files, the command tree exactly 24
        # commands in 5 categories, both surfaces wired, config validity, schema
        # application, no placeholders, no committed secrets.
        run: npm run audit

      - name: Run the test suite
        run: npm test

      - name: Verify the database initialises from nothing
        # The audit uses an in-memory database; this exercises the real on-disk path
        # including directory creation and the migration runner.
        run: |
          node scripts/init-db.js --path ./ci-check.sqlite
          node scripts/init-db.js --check --path ./ci-check.sqlite
          rm -f ./ci-check.sqlite ./ci-check.sqlite-wal ./ci-check.sqlite-shm

      - name: Verify the health check reports a missing heartbeat
        # A regression here would make an orchestrator consider a dead container
        # healthy, which is the failure mode that does the most damage.
        run: |
          if node scripts/healthcheck.js --path ./no-such-heartbeat; then
            echo "::error::The health check reported healthy with no heartbeat file present."
            exit 1
          fi
          echo "The health check correctly reported unhealthy."

      - name: Verify the slash command payload builds
        # A dry run: nothing contacts Discord. Catches a structural conflict in the
        # command tree, which would otherwise fail at deploy time with an error
        # naming only an array index.
        env:
          DISCORD_TOKEN: 'MTExMTExMTExMTExMTExMTEx.GaBcDe.fGhIjKlMnOpQrStUvWxYz1234567890'
          CLIENT_ID: '111111111111111111'
          PANEL_URL: 'https://panel.example.invalid'
          PANEL_APP_KEY: 'ptla_cibuildplaceholderkey000000000000000'
          PANEL_CLIENT_KEY: 'ptlc_cibuildplaceholderkey000000000000000'
        run: node src/deploy-commands.js --dry-run

  # ---------------------------------------------------------------------------
  # Container image
  # ---------------------------------------------------------------------------
  docker:
    name: Build the container image
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          # THE FIX. Without this, buildx leaves the image in its own cache and
          # never hands it to the Docker daemon — so `docker run panelkit-bot:ci`
          # fails with "Unable to find image locally" and then tries to pull it
          # from Docker Hub. That exits non-zero, which looks like the assertion
          # passing, and then fails on the message check for the wrong reason.
          load: true
          tags: panelkit-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Confirm the image is available to the daemon
        # Cheap, and it distinguishes "the image did not load" from "the bot
        # misbehaved" in the two assertions below.
        run: docker image inspect panelkit-bot:ci > /dev/null

      - name: Verify the image starts and refuses an empty environment
        # The bot must fail fast and legibly with no configuration rather than
        # starting half-configured. Both the non-zero exit and the message content
        # are asserted, because the message is all an operator sees.
        run: |
          set +e
          output="$(docker run --rm panelkit-bot:ci 2>&1)"
          status=$?
          set -e

          echo "--- container output ---"
          echo "$output"
          echo "------------------------"

          if [ "$status" -eq 0 ]; then
            echo "::error::The bot exited successfully with no configuration; it should have failed."
            exit 1
          fi

          # Guard against mistaking a Docker failure for a startup failure. Without
          # this, an image that never loaded would satisfy the exit-code check.
          if echo "$output" | grep -qiE 'unable to find image|pull access denied|no such image'; then
            echo "::error::The image was not available to the Docker daemon. Check that 'load: true' is set on the build step."
            exit 1
          fi

          if ! echo "$output" | grep -q 'DISCORD_TOKEN'; then
            echo "::error::The startup error did not name the missing variables."
            exit 1
          fi

          echo "The image correctly refused to start without configuration."

      - name: Verify the health check runs inside the image
        # Confirms scripts/healthcheck.js reached the runtime stage. The
        # Dockerfile's HEALTHCHECK depends on it, and a missing file would make
        # every container report unhealthy.
        run: |
          set +e
          docker run --rm --entrypoint node panelkit-bot:ci scripts/healthcheck.js
          status=$?
          set -e

          if [ "$status" -eq 0 ]; then
            echo "::error::The health check reported healthy in a container with no running bot."
            exit 1
          fi

          echo "The health check is present and correctly reports unhealthy."

  # ---------------------------------------------------------------------------
  # Committed secrets
  # ---------------------------------------------------------------------------
  secrets:
    name: Scan for committed secrets
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          # Full history. A credential committed and later removed still exists in
          # the object store, so scanning only the tip misses the one mistake a
          # follow-up commit cannot fix.
          fetch-depth: 0

      - name: Scan the tree for credential shapes
        # Narrow patterns deliberately. A broad "long random string" rule fires on
        # every hash and lockfile integrity field, and a scanner that cries wolf
        # gets ignored.
        run: |
          set -euo pipefail

          patterns=(
            'ptla_[A-Za-z0-9]{40,}'
            'ptlc_[A-Za-z0-9]{40,}'
            '[A-Za-z0-9_-]{24,28}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,}'
          )

          found=0
          for pattern in "${patterns[@]}"; do
            if git grep -nIE "$pattern" -- \
                 ':!tests/**' \
                 ':!.github/workflows/**' \
                 ':!package-lock.json' \
                 ':!*.md' \
                 > /dev/null 2>&1; then
              echo "::error::A value matching a credential pattern was found:"
              git grep -nIE "$pattern" -- ':!tests/**' ':!.github/workflows/**' ':!package-lock.json' ':!*.md' || true
              found=1
            fi
          done

          if [ "$found" -eq 1 ]; then
            echo "::error::Committed credentials must be revoked, not merely removed: git history retains them."
            exit 1
          fi

          echo "No credential-shaped values found in tracked files."

      - name: Verify .env is not tracked
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "::error::.env is tracked by git. Remove it from the index, revoke every credential it contained, and confirm .gitignore covers it."
            exit 1
          fi

          for tracked in $(git ls-files '.env.*'); do
            if [ "$tracked" != ".env.example" ]; then
              echo "::error::$tracked is tracked by git. Only .env.example may be committed."
              exit 1
            fi
          done

          echo ".env is not tracked. Only .env.example is committed."

      - name: Verify .env.example carries no values
        run: |
          set -euo pipefail

          required='DISCORD_TOKEN CLIENT_ID PANEL_URL PANEL_APP_KEY PANEL_CLIENT_KEY ADMIN_USER_IDS ADMIN_ROLE_IDS GUILD_ID'

          for key in $required; do
            value="$(grep -E "^${key}=" .env.example | head -n 1 | cut -d= -f2- || true)"
            if [ -n "$value" ]; then
              echo "::error::.env.example assigns a value to ${key}. Every credential placeholder must be empty."
              exit 1
            fi
          done

          echo ".env.example contains no credential values."
